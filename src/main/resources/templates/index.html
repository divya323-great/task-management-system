<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<title>Task Management</title>

<style>
body{font-family:Arial;background:#f2f2f2}
.container{width:90%;margin:auto;margin-top:40px;background:white;padding:30px;border-radius:10px}
table{width:100%;border-collapse:collapse}
th{background:#007bff;color:white;padding:10px}
td{padding:10px;text-align:center;border-bottom:1px solid #ddd}
.btn{padding:6px 12px;border-radius:5px;color:white;text-decoration:none}
.add{background:green}
.edit{background:blue}
.delete{background:red}
</style>

</head>

<body>

<div style="width:100%; max-width:1200px; margin:auto;">

<div style="text-align:center; padding:20px; font-size:24px; font-weight:bold;">
Task Management System
</div>

<a th:href="@{/showNewTaskForm}" class="btn add">Add Task</a>

<table>

<tr>
<th>Title</th>
<th>Description</th>
<th>Due Date</th>
<th>Status</th>
<th>Remarks</th>
<th>Created By</th>
<th>Created On</th>
<th>Updated By</th>
<th>Updated On</th>
<th>Actions</th>
</tr>

<tr th:each="task : ${listTasks}">

<td th:text="${task.title}"></td>
<td th:text="${task.description}"></td>
<td th:text="${task.dueDate}"></td>
<td th:text="${task.status}"></td>
<td th:text="${task.remarks}"></td>
<td th:text="${task.createdByName} + ' (' + ${task.createdById} + ')'"></td>
<td th:text="${task.createdOn}"></td>
<td th:text="${task.lastUpdatedByName}"></td>
<td th:text="${task.lastUpdatedOn}"></td>

<td style="text-align:center;">

<a th:href="@{/showFormForUpdate/{id}(id=${task.id})}"
style="display:block; margin:5px auto; width:70px;
background:#3498db; color:white; padding:5px; text-decoration:none; border-radius:4px;">
Edit
</a>

<a th:href="@{/deleteTask/{id}(id=${task.id})}"
onclick="return confirm('Are you sure you want to delete this task?')"
style="display:block; margin:5px auto; width:70px;
background:#e74c3c; color:white; padding:5px; text-decoration:none; border-radius:4px;">
Delete
</a>

</td>

</tr>

</table>

</div>

</body>
</html>
